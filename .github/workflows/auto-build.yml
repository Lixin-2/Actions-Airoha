name: Auto Build XG-040G-MF (rayniel XG-PON driver)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mf-build-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PONWRT_REPO: https://github.com/pbs05/ponwrt
  PONWRT_REF: master
  DRIVER_REPO: https://github.com/rayniel/openwrt-pon-drivers
  DRIVER_REF: rayniel/an7583-xgpon-diagnostics
  FW_CONFIG: xg-040g-mf-ubi.config

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget ccache \
            subversion quilt time patch bzip2

      - name: Clone PonWrt source
        run: |
          git clone --depth=1 --branch "$PONWRT_REF" "$PONWRT_REPO" openwrt
          cd openwrt
          echo "source commit: $(git log -1 --format='%h %ad %s' --date=short)"

      - name: Switch driver feed to rayniel branch
        run: |
          cd openwrt
          echo "--- before ---"
          grep -n 'pon_drivers' feeds.conf.default
          sed -i "s#https://github.com/pbs05/openwrt-pon-drivers.git#${DRIVER_REPO}.git^${DRIVER_REF}#" feeds.conf.default
          echo "--- after ---"
          grep -n 'pon_drivers' feeds.conf.default

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify and enable stock BWmap fix
        run: |
          cd openwrt
          SRC=$(find feeds -path '*airoha-xpon/src/airoha-xpon-xgpon.c' | head -1)
          echo "SRC=$SRC"
          if [ -z "$SRC" ]; then echo "ERROR: airoha-xpon 源码未找到（feeds 未切到 rayniel 分支）"; exit 1; fi
          if ! grep -q 'xgpon_stock_bwmap' "$SRC"; then
            echo "ERROR: 该分支不含 xgpon_stock_bwmap 补丁"; exit 1
          fi
          grep -n 'xgpon_stock_bwmap' "$SRC" | head -5
          sed -i 's/^static bool xgpon_stock_bwmap;/static bool xgpon_stock_bwmap = true;/' "$SRC"
          echo "--- patched ---"
          grep -n 'xgpon_stock_bwmap = true' "$SRC"
          sed -i 's/^PKG_RELEASE:=73$/PKG_RELEASE:=74/' feeds/pon_drivers/airoha-xpon/Makefile 2>/dev/null || true
          grep -n 'PKG_RELEASE' feeds/pon_drivers/airoha-xpon/Makefile | head -2

      - name: Prepare config
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/$FW_CONFIG" .config
          make defconfig
          grep -E 'CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi|CONFIG_PACKAGE_luci-app-pon' .config

      - name: Build firmware
        run: |
          cd openwrt
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect artifacts
        if: always()
        run: |
          cd openwrt
          mkdir -p "$GITHUB_WORKSPACE/out"
          find bin/targets/airoha -maxdepth 2 -type f \
            \( -name '*mf*' -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -exec cp {} "$GITHUB_WORKSPACE/out/" \; 2>/dev/null || true
          find build_dir -name 'airoha-xpon.ko' -exec cp {} "$GITHUB_WORKSPACE/out/" \; 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/out" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-build-${{ github.run_number }}
          path: out/
          if-no-files-found: warn

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: XG-040G-MF (rayniel driver) build ${{ github.run_number }}
          body: |
            - 源码: pbs05/ponwrt@master
            - 驱动: rayniel/openwrt-pon-drivers@${{ env.DRIVER_REF }}
            - 已把 `xgpon_stock_bwmap` 默认置为 true
            - 目标: nokia_xg-040g-mf-ubi
          files: out/*
          generate_release_notes: false
