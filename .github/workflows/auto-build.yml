name: Auto Build XG-040G-MF (rayniel XG-PON driver)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mf-build-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  PONWRT_REPO: https://github.com/pbs05/ponwrt
  PONWRT_REF: master
  DRIVER_REPO: https://github.com/rayniel/openwrt-pon-drivers
  DRIVER_REF: rayniel/an7583-xgpon-diagnostics
  FW_CONFIG: xg-040g-mf-ubi.config

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Add swap (防 OOM)
        run: |
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget ccache \
            subversion quilt time patch bzip2

      - name: Clone PonWrt source
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf openwrt
          git clone --depth=1 --branch "$PONWRT_REF" "$PONWRT_REPO" "$GITHUB_WORKSPACE/openwrt"
          test -d "$GITHUB_WORKSPACE/openwrt" || { echo "clone 后目录不存在"; ls -la; exit 1; }
          cd "$GITHUB_WORKSPACE/openwrt"
          echo "source commit: $(git log -1 --format='%h %ad %s' --date=short)"

      - name: Switch driver feed to rayniel branch
        run: |
          cd "$GITHUB_WORKSPACE/openwrt" || { echo "MISSING openwrt"; ls -la "$GITHUB_WORKSPACE"; exit 1; }
          echo "--- before ---"
          grep -n 'pon_drivers' feeds.conf.default
          sed -i "s#https://github.com/pbs05/openwrt-pon-drivers.git#${DRIVER_REPO}.git^${DRIVER_REF}#" feeds.conf.default
          echo "--- after ---"
          grep -n 'pon_drivers' feeds.conf.default

      - name: Update and install feeds
        run: |
          cd "$GITHUB_WORKSPACE/openwrt" || { echo "MISSING openwrt"; ls -la "$GITHUB_WORKSPACE"; exit 1; }
          set +e
          ./scripts/feeds update -a; RC_UPDATE=$?
          echo "feeds update rc=$RC_UPDATE"
          if [ ! -d feeds/pon_drivers/airoha-xpon ]; then
            echo "!! pon_drivers 未就绪，改为手动 clone 分支"
            rm -rf feeds/pon_drivers
            git clone --depth 1 --branch "$DRIVER_REF" "${DRIVER_REPO}.git" feeds/pon_drivers
            echo "manual clone rc=$?"
          fi
          ./scripts/feeds install -a; RC_INSTALL=$?
          echo "feeds install rc=$RC_INSTALL"
          echo "--- feeds 顶层 ---"; ls feeds || true
          echo "--- feeds/pon_drivers ---"; ls feeds/pon_drivers 2>/dev/null | head -20 || true
          git -C feeds/pon_drivers log -1 --format='driver: %h %ad %s' --date=short 2>/dev/null || true
          {
            echo "### feeds 诊断"
            echo '```'
            echo "update rc=$RC_UPDATE install rc=$RC_INSTALL"
            grep -n 'pon_drivers' feeds.conf.default || true
            ls feeds 2>/dev/null || true
            git -C feeds/pon_drivers log -1 --format='%h %ad %s' --date=short 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$RC_UPDATE" -eq 0 ] && [ "$RC_INSTALL" -eq 0 ]

      - name: Verify and enable stock BWmap fix
        run: |
          cd "$GITHUB_WORKSPACE/openwrt" || { echo "MISSING openwrt"; ls -la "$GITHUB_WORKSPACE"; exit 1; }
          SRC=$(find feeds -name 'airoha-xpon-xgpon.c' | head -1)
          echo "SRC=$SRC"
          if [ -z "$SRC" ]; then
            echo "ERROR: 未找到 airoha-xpon 源码"
            find feeds -maxdepth 4 -iname '*airoha*' | head -20
            exit 1
          fi
          if ! grep -q 'xgpon_stock_bwmap' "$SRC"; then
            echo "ERROR: 该源码不含 xgpon_stock_bwmap 补丁（分支不对）"
            grep -n 'BWM_CHK_CTRL' "$SRC" | head -5 || true
            exit 1
          fi
          grep -n 'xgpon_stock_bwmap' "$SRC" | head -5
          sed -i 's/^static bool xgpon_stock_bwmap;/static bool xgpon_stock_bwmap = true;/' "$SRC"
          echo "--- patched ---"
          grep -n 'xgpon_stock_bwmap = true' "$SRC" || true
          MK=$(dirname "$SRC")/../Makefile
          [ -f "$MK" ] && sed -i 's/^PKG_RELEASE:=.*/PKG_RELEASE:=74/' "$MK" && grep -n '^PKG_RELEASE' "$MK"
          {
            echo "### 驱动补丁"
            echo '```'
            echo "SRC=$SRC"
            grep -n 'xgpon_stock_bwmap' "$SRC" | head -5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare config
        run: |
          cd "$GITHUB_WORKSPACE/openwrt" || { echo "MISSING openwrt"; ls -la "$GITHUB_WORKSPACE"; exit 1; }
          cp "$GITHUB_WORKSPACE/$FW_CONFIG" .config
          make defconfig
          grep -E 'CONFIG_TARGET_airoha_an7583_DEVICE_nokia_xg-040g-mf-ubi|CONFIG_PACKAGE_luci-app-pon' .config

      - name: Build firmware
        run: |
          cd "$GITHUB_WORKSPACE/openwrt" || { echo "MISSING openwrt"; ls -la "$GITHUB_WORKSPACE"; exit 1; }
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect artifacts
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/openwrt" || { echo "MISSING openwrt"; ls -la "$GITHUB_WORKSPACE"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out"
          find bin/targets/airoha -maxdepth 2 -type f \
            \( -name '*mf*' -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -exec cp {} "$GITHUB_WORKSPACE/out/" \; 2>/dev/null || true
          find build_dir -name 'airoha-xpon.ko' -exec cp {} "$GITHUB_WORKSPACE/out/" \; 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/out" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-build-${{ github.run_number }}
          path: out/
          if-no-files-found: warn

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: XG-040G-MF (rayniel driver) build ${{ github.run_number }}
          body: |
            - 源码: pbs05/ponwrt@master
            - 驱动: rayniel/openwrt-pon-drivers@${{ env.DRIVER_REF }}
            - 已把 `xgpon_stock_bwmap` 默认置为 true
            - 目标: nokia_xg-040g-mf-ubi
          files: out/*
          generate_release_notes: false
